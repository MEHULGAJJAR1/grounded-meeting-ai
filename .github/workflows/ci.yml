name: Validate application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check backend scripts
      - run: python -m pytest -c backend/pytest.ini backend/tests --cov=backend/app --cov-report=term-missing

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grounded_test
          POSTGRES_DB: grounded_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grounded_test -d grounded_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      ALLOW_DEMO_DATA: 'false'
      AI_PROVIDER: local
      DATABASE_URL: postgresql+psycopg://grounded_test@localhost:5432/grounded_test
      TEST_DATABASE_URL: postgresql+psycopg://grounded_test@localhost:5432/grounded_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/configure.py
      - run: PYTHONPATH=backend python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m pytest -c backend/pytest.ini backend/tests

  frontend-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/configure.py
      - run: docker compose config --quiet
